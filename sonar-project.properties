# ============================================================
# Configuracion de SonarCloud - Las Casas del Escuintleco
# ============================================================
# IMPORTANTE: reemplaza los valores de organization y projectKey
# por los que te asigne SonarCloud al crear el proyecto.

sonar.organization=roxanacp
sonar.projectKey=RoxanaCP_Escuintleco
sonar.projectName=Escuintleco

# ------------------------------------------------------------
# Rutas de codigo fuente (backend Java + frontend TypeScript)
# ------------------------------------------------------------
sonar.sources=escuintleco/backend/src/main/java,escuintleco/frontend/src
sonar.tests=escuintleco/backend/src/test/java

# Excluir archivos de prueba, node_modules y artefactos de build del analisis de fuentes
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.spec.ts

# ------------------------------------------------------------
# Backend Java
# ------------------------------------------------------------
sonar.java.binaries=escuintleco/backend/target/classes
# Reporte de cobertura JaCoCo (XML)
sonar.coverage.jacoco.xmlReportPaths=escuintleco/backend/target/site/jacoco/jacoco.xml

# ------------------------------------------------------------
# Frontend TypeScript
# ------------------------------------------------------------
# Reporte de cobertura LCOV generado por Karma/Istanbul
sonar.javascript.lcov.reportPaths=escuintleco/frontend/coverage/frontend/lcov.info
sonar.typescript.lcov.reportPaths=escuintleco/frontend/coverage/frontend/lcov.info

# ------------------------------------------------------------
# Codificacion
# ------------------------------------------------------------
sonar.sourceEncoding=UTF-8
