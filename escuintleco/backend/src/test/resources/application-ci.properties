# Configuracion del backend para el entorno de CI (GitHub Actions)
# Apunta al servicio MySQL del pipeline.

spring.datasource.url=jdbc:mysql://localhost:3306/escuintleco_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crea el esquema automaticamente en el entorno de CI
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT (valores de prueba)
jwt.secret=ci_secret_key_para_pruebas_muy_larga_y_segura_escuintleco
jwt.expiration=86400000
