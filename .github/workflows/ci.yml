name: CI/CD Pipeline - Escuintleco

# Se dispara en pull requests a main y en push a main (pruebas de regresion)
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # ============================================================
  # ETAPA 1: BUILD - compila backend y frontend
  # ============================================================
  build:
    name: Build (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar backend (sin tests)
        working-directory: escuintleco/backend
        run: mvn -B -DskipTests package

      - name: Instalar dependencias del frontend
        working-directory: escuintleco/frontend
        run: npm ci --legacy-peer-deps

      - name: Construir frontend
        working-directory: escuintleco/frontend
        run: npm run build

  # ============================================================
  # ETAPA 2a: TEST BACKEND - pruebas + cobertura JaCoCo
  # ============================================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: build
    # Base de datos MySQL para pruebas de integracion
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: escuintleco_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas + cobertura (mvn verify)
        working-directory: escuintleco/backend
        run: mvn -B verify -Dspring.profiles.active=ci

      - name: Subir reporte de cobertura JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: escuintleco/backend/target/site/jacoco/

  # ============================================================
  # ETAPA 2b: TEST FRONTEND - pruebas + cobertura Istanbul
  # ============================================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        working-directory: escuintleco/frontend
        run: npm ci --legacy-peer-deps

      - name: Analisis estatico con ESLint (linter)
        working-directory: escuintleco/frontend
        run: npm run lint
        continue-on-error: true

      - name: Ejecutar pruebas con cobertura (headless)
        working-directory: escuintleco/frontend
        run: npm run test:ci

      - name: Subir reporte de cobertura LCOV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-report
          path: escuintleco/frontend/coverage/frontend/

  # ============================================================
  # ETAPA 2c: E2E - pruebas end-to-end de API con Newman
  # ============================================================
  e2e:
    name: E2E (Postman/Newman)
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: escuintleco_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cargar esquema y datos iniciales en MySQL
        run: mysql -h 127.0.0.1 -u root -proot escuintleco_db < escuintleco/database/escuintleco_db.sql

      - name: Empaquetar backend
        working-directory: escuintleco/backend
        run: mvn -B -DskipTests package

      - name: Iniciar backend en segundo plano
        working-directory: escuintleco/backend
        run: |
          java -jar target/escuintleco-backend-1.0.0.jar --spring.profiles.active=ci &
          echo "Esperando a que el backend inicie..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/auth/login -o /dev/null; then
              echo "Backend listo"; break
            fi
            sleep 3
          done

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar pruebas E2E
        run: newman run escuintleco/e2e/escuintleco.postman_collection.json

  # ============================================================
  # ETAPA 3: ANALYZE - analisis estatico + Quality Gate
  # ============================================================
  analyze:
    name: Analyze (SonarCloud + Quality Gate)
    runs-on: ubuntu-latest
    needs: [ test-backend, test-frontend ]
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: escuintleco_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud necesita el historial completo

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Regenera los reportes de cobertura para que SonarCloud los ingiera
      - name: Generar cobertura del backend
        working-directory: escuintleco/backend
        run: mvn -B verify -Dspring.profiles.active=ci
        continue-on-error: true

      - name: Instalar dependencias del frontend
        working-directory: escuintleco/frontend
        run: npm ci --legacy-peer-deps

      - name: Generar cobertura del frontend
        working-directory: escuintleco/frontend
        run: npm run test:ci
        continue-on-error: true

      - name: Escaneo de SonarCloud y evaluacion del Quality Gate
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # ============================================================
  # ETAPA 4: REPORT - agrega artefactos y escribe el resumen
  # ============================================================
  report:
    name: Report (resumen del run)
    runs-on: ubuntu-latest
    needs: [ analyze, e2e ]
    if: always()
    steps:
      - name: Descargar reporte de cobertura del backend
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: reportes/backend
        continue-on-error: true

      - name: Descargar reporte de cobertura del frontend
        uses: actions/download-artifact@v4
        with:
          name: lcov-report
          path: reportes/frontend
        continue-on-error: true

      - name: Escribir resumen del pipeline
        run: |
          echo "## Resumen del Pipeline CI/CD - Escuintleco" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Backend | ${{ needs.test-backend.result || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Frontend | ${{ needs.test-frontend.result || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Analyze (SonarCloud) | ${{ needs.analyze.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Los reportes de cobertura (JaCoCo y LCOV) estan disponibles como artefactos del run." >> $GITHUB_STEP_SUMMARY
